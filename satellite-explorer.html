<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Satellite Explorer — Stadia Maps</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />

<style>
  :root{
    --bg: #0d1117;
    --panel: #14191f;
    --panel-border: #232b33;
    --text: #e6edf3;
    --text-dim: #8b98a5;
    --accent: #ff8a3d;
    --accent-dim: #7a4a26;
    --mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    overflow: hidden;
  }

  #sidebar {
    width: 300px;
    min-width: 300px;
    background: var(--panel);
    border-right: 1px solid var(--panel-border);
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  .sidebar-header {
    padding: 16px 18px 14px;
    border-bottom: 1px solid var(--panel-border);
  }
  .sidebar-header h1 {
    font-size: 15px;
    font-weight: 600;
    margin: 0 0 2px;
    letter-spacing: -0.01em;
  }
  .sidebar-header p {
    font-size: 12px;
    color: var(--text-dim);
    margin: 0;
  }

  .section {
    padding: 14px 18px;
    border-bottom: 1px solid var(--panel-border);
  }
  .section-label {
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-dim);
    margin: 0 0 10px;
    font-weight: 600;
  }

  input[type="text"], input[type="password"] {
    width: 100%;
    background: #1a2129;
    border: 1px solid var(--panel-border);
    color: var(--text);
    padding: 8px 10px;
    border-radius: 6px;
    font-size: 12.5px;
    font-family: var(--mono);
    outline: none;
  }
  input[type="text"]:focus, input[type="password"]:focus {
    border-color: var(--accent-dim);
  }
  .key-row { display: flex; gap: 6px; }
  .key-row input { flex: 1; }
  .key-status {
    font-size: 11px;
    margin-top: 6px;
    color: var(--text-dim);
  }
  .key-status.live { color: #5fd97a; }

  .tool-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }
  .tool-btn {
    background: #1a2129;
    border: 1px solid var(--panel-border);
    color: var(--text);
    padding: 9px 8px;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: background 0.12s, border-color 0.12s;
  }
  .tool-btn:hover { background: #202834; border-color: #303c48; }
  .tool-btn.active { background: var(--accent-dim); border-color: var(--accent); color: #ffd9b8; }

  #feature-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px 10px;
  }
  .feature-item {
    background: #171e26;
    border: 1px solid var(--panel-border);
    border-radius: 6px;
    padding: 9px 10px;
    margin-bottom: 6px;
    cursor: pointer;
    transition: border-color 0.12s;
  }
  .feature-item:hover { border-color: #3a4753; }
  .feature-item .name {
    font-size: 12.5px;
    font-weight: 500;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .feature-item .meta {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 3px;
    font-family: var(--mono);
  }
  .feature-item .del {
    color: var(--text-dim);
    font-size: 14px;
    padding: 0 4px;
  }
  .feature-item .del:hover { color: #ff6b6b; }
  .empty-hint {
    color: var(--text-dim);
    font-size: 12px;
    text-align: center;
    padding: 24px 10px;
    line-height: 1.5;
  }

  #export-section {
    padding: 14px 18px 18px;
    border-top: 1px solid var(--panel-border);
  }
  .export-row { display: flex; gap: 8px; }
  .primary-btn {
    flex: 1;
    background: var(--accent);
    border: none;
    color: #1a0f05;
    font-weight: 600;
    padding: 10px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
  }
  .primary-btn:hover { background: #ff9c5c; }
  .secondary-btn {
    flex: 1;
    background: #1a2129;
    border: 1px solid var(--panel-border);
    color: var(--text);
    font-weight: 500;
    padding: 10px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
  }
  .secondary-btn:hover { background: #202834; }

  #map { flex: 1; height: 100vh; background: #0a0d11; }

  .leaflet-container { background: #0a0d11; font-family: inherit; }

  /* minimal override of leaflet.draw toolbar visuals to sit quietly in dark UI */
  .leaflet-draw-toolbar a { background-color: #1a2129 !important; border-color: #303c48 !important; }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: #2a333d; border-radius: 4px; }
</style>
</head>
<body>

<div id="sidebar">
  <div class="sidebar-header">
    <h1>Satellite Explorer</h1>
    <p>Stadia Maps · markers · measure · export</p>
  </div>

  <div class="section">
    <p class="section-label">Stadia API Key</p>
    <div class="key-row">
      <input type="password" id="apiKeyInput" placeholder="paste your key" />
    </div>
    <div class="key-status" id="keyStatus">not set — showing placeholder tiles</div>
  </div>

  <div class="section">
    <p class="section-label">Tools</p>
    <div class="tool-grid">
      <button class="tool-btn" id="btnMarker">📍 Marker</button>
      <button class="tool-btn" id="btnLine">📏 Line</button>
      <button class="tool-btn" id="btnPolygon">▱ Polygon</button>
      <button class="tool-btn" id="btnEdit">✎ Edit</button>
    </div>
  </div>

  <div class="section" style="border-bottom:none; padding-bottom:8px;">
    <p class="section-label">Features (<span id="featureCount">0</span>)</p>
  </div>
  <div id="feature-list">
    <div class="empty-hint" id="emptyHint">No features yet.<br>Use the tools above to place markers or draw lines/polygons — distance and area are calculated automatically.</div>
  </div>

  <div id="export-section">
    <p class="section-label">Export</p>
    <div class="export-row">
      <button class="secondary-btn" id="btnKML">.KML</button>
      <button class="primary-btn" id="btnKMZ">.KMZ</button>
    </div>
  </div>
</div>

<div id="map"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
<script src="https://unpkg.com/[email protected]/tokml.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

<script>
  // ---------- Map setup ----------
  const map = L.map('map', { zoomControl: false, attributionControl: true }).setView([20, 0], 3);
  L.control.zoom({ position: 'bottomright' }).addTo(map);

  let satLayer = null;
  const PLACEHOLDER_URL = 'https://tiles.stadiamaps.com/tiles/alidade_smooth_dark/{z}/{x}/{y}{r}.png';
  const SAT_URL_TEMPLATE = 'https://tiles.stadiamaps.com/tiles/alidade_satellite/{z}/{x}/{y}{r}.jpg?api_key=';

  function setTileLayer(apiKey) {
    if (satLayer) map.removeLayer(satLayer);
    const url = apiKey ? (SAT_URL_TEMPLATE + apiKey) : PLACEHOLDER_URL;
    satLayer = L.tileLayer(url, {
      maxZoom: 20,
      attribution: '&copy; <a href="https://stadiamaps.com/">Stadia Maps</a> &copy; <a href="https://openmaptiles.org/">OpenMapTiles</a> &copy; OpenStreetMap contributors'
    }).addTo(map);
  }
  setTileLayer(null);

  const keyInput = document.getElementById('apiKeyInput');
  const keyStatus = document.getElementById('keyStatus');
  keyInput.addEventListener('change', () => {
    const key = keyInput.value.trim();
    setTileLayer(key || null);
    if (key) {
      keyStatus.textContent = 'live — satellite imagery active';
      keyStatus.classList.add('live');
    } else {
      keyStatus.textContent = 'not set — showing placeholder tiles';
      keyStatus.classList.remove('live');
    }
  });

  // ---------- Drawing / feature layer ----------
  const drawnItems = new L.FeatureGroup().addTo(map);
  let featureCounter = 0;
  const featureMeta = new Map(); // leaflet layer -> {id, type, name}

  function metersToLabel(m) {
    if (m >= 1000) return (m / 1000).toFixed(2) + ' km';
    return Math.round(m) + ' m';
  }
  function sqMetersToLabel(sqm) {
    if (sqm >= 1e6) return (sqm / 1e6).toFixed(3) + ' km²';
    return Math.round(sqm) + ' m²';
  }

  function lineLength(latlngs) {
    let total = 0;
    for (let i = 1; i < latlngs.length; i++) total += latlngs[i - 1].distanceTo(latlngs[i]);
    return total;
  }

  function addFeature(layer, type) {
    featureCounter++;
    const id = 'f' + featureCounter;
    let name = type === 'marker' ? `Marker ${featureCounter}` : type === 'polyline' ? `Line ${featureCounter}` : `Polygon ${featureCounter}`;
    featureMeta.set(layer, { id, type, name });
    drawnItems.addLayer(layer);

    if (type === 'marker') {
      layer.bindPopup(name);
    } else {
      layer.bindTooltip(name, { permanent: false });
    }

    renderFeatureList();
  }

  function measureFor(layer, type) {
    if (type === 'marker') {
      const ll = layer.getLatLng();
      return `${ll.lat.toFixed(5)}, ${ll.lng.toFixed(5)}`;
    }
    if (type === 'polyline') {
      return metersToLabel(lineLength(layer.getLatLngs()));
    }
    if (type === 'polygon') {
      const latlngs = layer.getLatLngs()[0];
      const area = L.GeometryUtil ? L.GeometryUtil.geodesicArea(latlngs) : 0;
      return sqMetersToLabel(Math.abs(area));
    }
    return '';
  }

  function renderFeatureList() {
    const list = document.getElementById('feature-list');
    const emptyHint = document.getElementById('emptyHint');
    document.getElementById('featureCount').textContent = featureMeta.size;

    list.querySelectorAll('.feature-item').forEach(el => el.remove());

    if (featureMeta.size === 0) {
      emptyHint.style.display = 'block';
      return;
    }
    emptyHint.style.display = 'none';

    featureMeta.forEach((meta, layer) => {
      const item = document.createElement('div');
      item.className = 'feature-item';
      const icon = meta.type === 'marker' ? '📍' : meta.type === 'polyline' ? '📏' : '▱';
      item.innerHTML = `
        <div class="name">${icon} ${meta.name} <span class="del" data-id="${meta.id}">✕</span></div>
        <div class="meta">${measureFor(layer, meta.type)}</div>
      `;
      item.addEventListener('click', (e) => {
        if (e.target.classList.contains('del')) return;
        if (meta.type === 'marker') map.panTo(layer.getLatLng());
        else map.fitBounds(layer.getBounds(), { maxZoom: 16 });
      });
      item.querySelector('.del').addEventListener('click', () => {
        drawnItems.removeLayer(layer);
        featureMeta.delete(layer);
        renderFeatureList();
      });
      list.appendChild(item);
    });
  }

  // ---------- Toolbar buttons drive Leaflet.draw handlers ----------
  const markerHandler = new L.Draw.Marker(map);
  const lineHandler = new L.Draw.Polyline(map, { shapeOptions: { color: '#ff8a3d', weight: 3 } });
  const polygonHandler = new L.Draw.Polygon(map, { shapeOptions: { color: '#ff8a3d', weight: 2, fillOpacity: 0.15 } });
  let activeHandler = null;
  let editMode = false;
  const editHandler = new L.EditToolbar.Edit(map, { featureGroup: drawnItems });

  function setActiveButton(btn) {
    document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
  }

  function disableAll() {
    markerHandler.disable();
    lineHandler.disable();
    polygonHandler.disable();
    if (editMode) { editHandler.disable(); editMode = false; }
  }

  document.getElementById('btnMarker').addEventListener('click', function () {
    const wasActive = this.classList.contains('active');
    disableAll(); setActiveButton(null);
    if (!wasActive) { markerHandler.enable(); setActiveButton(this); }
  });
  document.getElementById('btnLine').addEventListener('click', function () {
    const wasActive = this.classList.contains('active');
    disableAll(); setActiveButton(null);
    if (!wasActive) { lineHandler.enable(); setActiveButton(this); }
  });
  document.getElementById('btnPolygon').addEventListener('click', function () {
    const wasActive = this.classList.contains('active');
    disableAll(); setActiveButton(null);
    if (!wasActive) { polygonHandler.enable(); setActiveButton(this); }
  });
  document.getElementById('btnEdit').addEventListener('click', function () {
    const wasActive = this.classList.contains('active');
    disableAll(); setActiveButton(null);
    if (!wasActive) { editHandler.enable(); editMode = true; setActiveButton(this); }
  });

  map.on(L.Draw.Event.CREATED, function (e) {
    addFeature(e.layer, e.layerType);
    disableAll(); setActiveButton(null);
  });
  map.on(L.Draw.Event.EDITED, renderFeatureList);

  // ---------- Export ----------
  function buildGeoJSON() {
    const features = [];
    featureMeta.forEach((meta, layer) => {
      const gj = layer.toGeoJSON();
      gj.properties = gj.properties || {};
      gj.properties.name = meta.name;
      if (meta.type !== 'marker') {
        gj.properties.description = measureFor(layer, meta.type);
      }
      features.push(gj);
    });
    return { type: 'FeatureCollection', features };
  }

  function exportKML() {
    if (featureMeta.size === 0) { alert('Add at least one marker, line, or polygon first.'); return; }
    const kml = tokml(buildGeoJSON());
    const blob = new Blob([kml], { type: 'application/vnd.google-earth.kml+xml' });
    saveAs(blob, 'satellite-explorer-export.kml');
  }

  async function exportKMZ() {
    if (featureMeta.size === 0) { alert('Add at least one marker, line, or polygon first.'); return; }
    const kml = tokml(buildGeoJSON());
    const zip = new JSZip();
    zip.file('doc.kml', kml);
    const blob = await zip.generateAsync({ type: 'blob' });
    saveAs(blob, 'satellite-explorer-export.kmz');
  }

  document.getElementById('btnKML').addEventListener('click', exportKML);
  document.getElementById('btnKMZ').addEventListener('click', exportKMZ);
</script>

</body>
</html>
